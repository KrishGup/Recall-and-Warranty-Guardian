[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gren"
version = "2.0.0"
description = "gren - Graph Engineering Runtime on Strands Agents: multi-agent workflows as explicit, verified, budgeted graphs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "strands-agents>=1.55,<2",
  "strands-agents-tools>=0.8,<1",
  "anthropic>=0.60",
  "pydantic>=2.6,<3",
  "pyyaml>=6",
  "jsonschema>=4",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.28"]

[project.scripts]
gren = "gren.cli:app"

[tool.setuptools.packages.find]
include = ["gren*"]

[tool.setuptools.package-data]
gren = ["server/ui/*.html", "_data/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
