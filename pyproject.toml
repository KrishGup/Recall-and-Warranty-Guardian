[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian"
version = "0.1.0"
description = "Recall & Warranty Guardian: a background agent on Strands Agents (via gren) that watches recall feeds and warranty windows for a household and only interrupts for real decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "strands-agents>=1.55,<2",
  "pydantic>=2.6,<3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.28",
  "rapidfuzz>=3.9",
  "pyyaml>=6",
  "typer>=0.12",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
aws = ["boto3>=1.34", "bedrock-agentcore"]

[project.scripts]
guardian = "guardian.cli:app"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.setuptools.package-data]
guardian = ["graphs/*.yaml", "graphs/prompts/*.md", "feeds/fixtures/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
