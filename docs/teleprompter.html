html,body { margin:0; height:100%; background:var(--ink); color:var(--paper); font-family:Lora,Georgia,serif; overflow:hidden; }
#top { position:fixed; inset:0 0 auto 0; height:64px; display:flex; align-items:center; gap:22px; padding:0 24px; font-family:'Roboto Slab',serif; font-size:22px; background:rgba(0,15,8,.92); border-bottom:1px solid #1f2b25; z-index:5; }

#blockno { color:var(--amber); }

#blockbar { position:fixed; top:69px; left:0; height:3px; background:var(--amber); width:0; z-index:5; }
#stage { position:fixed; top:80px; bottom:0; left:0; right:0; display:grid; grid-template-columns:minmax(0,1fr) 0; transition:grid-template-columns .2s; }
#stage.video { grid-template-columns:minmax(0,1fr) 34vw; }
#text { padding:22px 5vw 40px; overflow:hidden; display:flex; flex-direction:column; justify-content:center; gap:34px; }
#cur { font-size:var(--size); line-height:1.42; font-weight:500; letter-spacing:.005em; }
#cur .w { color:#3a4540; transition:color .12s; }
#cur .w.said { color:var(--paper); }
#cur .w.now { color:var(--amber); text-decoration:underline; text-decoration-color:var(--amber); text-underline-offset:.16em; }
#next { font-size:calc(var(--size) * .5); line-height:1.4; color:#6e7a75; border-top:1px solid #22302a; padding-top:22px; }
#next b { color:#9aa6a0; font-family:'Roboto Slab',serif; font-weight:600; font-size:.7em; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:8px; }
#cue { font-family:'Roboto Slab',serif; font-size:19px; color:var(--amber); letter-spacing:.06em; text-transform:uppercase; }
#cue span { color:#B9C3BD; text-transform:none; letter-spacing:0; font-family:Lora,serif; font-size:19px; }
#vid { background:#000; display:flex; align-items:center; justify-content:center; border-left:1px solid #1f2b25; }
#vid video { width:100%; max-height:100%; }

#count.on { display:flex; }

  curEl.innerHTML = b.words.map((w, k) => `<span class="w" data-k="${k}">${w}</span>`).join(' ');
  const n = BLOCKS[i + 1];
  nextEl.innerHTML = n ? `<b>Next · ${mmssI(n.start)} · ${n.on}</b>${n.text}` : '<b>Last block</b>';
  cueEl.innerHTML = `${mmssI(b.start)}–${mmssI(b.end)} <span>· ${b.on}</span>`;
  blockEl.textContent = `block ${i + 1} / ${BLOCKS.length}`;
  paceEl.textContent = `${b.words.length} words · ${(b.syllables / (b.end - b.start)).toFixed(1)} syllables/s · ${Math.round(b.words.length / (b.end - b.start) * 60)} wpm`;
  shown = i;
}
function render() {
  const i = blockAt(t);
  if (i !== shown) renderBlock(i);
  const b = BLOCKS[i];
  const span = (b.end - b.start) * TAIL - LEAD;
  const frac = Math.min(1, Math.max(0, (t - b.start - LEAD) / Math.max(0.1, span)));
  const total = b.cum[b.cum.length - 1]; let due = 0; while (due < b.words.length && b.cum[due] <= frac * total) due++;
  const spans = curEl.children;
  for (let k = 0; k < spans.length; k++) { spans[k].className = 'w' + (k < due ? ' said' : '') + (k === due ? ' now' : ''); }
  clockEl.textContent = mmss(t) + ' / ' + mmssI(TOTAL);
  bar.style.width = (100 * Math.min(1, t / TOTAL)) + '%';
  bbar.style.width = (100 * Math.min(1, Math.max(0, (t - b.start) / (b.end - b.start)))) + '%';
  doneEl.style.display = t >= TOTAL ? 'block' : 'none';
}
function loop(now) {
  if (!playing) return;
  if (useVideo && !video.paused && !video.ended) t = video.currentTime;
  else { if (last != null) t += (now - last) / 1000; }
  last = now;
  if (t >= TOTAL) { t = TOTAL; playing = false; if (useVideo) video.pause(); }
  render();
  if (playing) raf = requestAnimationFrame(loop);
}
function play() { if (playing) return; playing = true; last = null; if (useVideo) { video.currentTime = t; video.play().catch(() => {}); } raf = requestAnimationFrame(loop); }
function pause() { playing = false; last = null; if (raf) cancelAnimationFrame(raf); if (useVideo) video.pause(); render(); }
function seek(time) { t = Math.max(0, Math.min(TOTAL, time)); if (useVideo) video.currentTime = t; render(); }
function countdown(n, then) { const c = document.getElementById('count'); c.textContent = n; c.classList.add('on'); if (n <= 1) { setTimeout(() => { c.classList.remove('on'); then(); }, 1000); } else setTimeout(() => countdown(n - 1, then), 1000); }
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (playing) pause(); else if (t <= 0.01) countdown(3, play); else play(); }
  else if (e.key === 'r' || e.key === 'R') { pause(); seek(0); shown = -1; render(); }
  else if (e.key === 'ArrowRight') { const i = blockAt(t); seek(BLOCKS[Math.min(BLOCKS.length - 1, i + 1)].start); }
  else if (e.key === 'ArrowLeft') { const i = blockAt(t); const b = BLOCKS[i]; seek(t - b.start > 1.5 ? b.start : BLOCKS[Math.max(0, i - 1)].start); }
  else if (e.key === '+' || e.key === '=') { size = Math.min(80, size + 4); document.documentElement.style.setProperty('--size', size + 'px'); }
  else if (e.key === '-' || e.key === '_') { size = Math.max(24, size - 4); document.documentElement.style.setProperty('--size', size + 'px'); }
  else if (e.key === 'v' || e.key === 'V') { document.getElementById('stage').classList.toggle('video'); }
  else if (e.key === 'm' || e.key === 'M') { document.body.classList.toggle('mirror'); }
  else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
});
video.addEventListener('loadedmetadata', () => { useVideo = true; document.getElementById('stage').classList.add('video'); });
video.addEventListener('error', () => { useVideo = false; });
renderBlock(0); render();
</script></body></html>
