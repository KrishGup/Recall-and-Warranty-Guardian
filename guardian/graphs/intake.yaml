# Guardian intake: a forwarded receipt or order confirmation becomes inventory rows.
#   redact (code: card numbers never reach a model) -> extract (agent, haiku) -> save_item (code: VIN decode, warranty term, activity row)
name: intake
version: 1
description: Turn a receipt, order confirmation or pasted product line into structured inventory items.
goal: One InventoryItem per purchased product, with brand, model, UPC, purchase date, retailer, price and warranty term when the text states them.

input_schema:
  type: object
  required: [text]
  properties:
    text: { type: string, minLength: 8 }
    source: { type: string, enum: [paste, email, manual], default: paste }

budget: { max_cost_usd: 0.30, max_wall_ms: 240000, max_width: 2 }
defaults: { model: haiku, failure: { retries: 1, timeout_ms: 120000, repair_attempts: 1 } }
output: { from: save_item }

nodes:
  - id: redact
    kind: code
    description: Strip card numbers (Luhn-valid 13-19 digit runs) before any model sees the text.
    module: ../reducers/redact.py
    input: { text: $input.text }

  - id: extract
    kind: agent
    model: haiku
    description: Extract the purchased products from the redacted text. Facts only; unknown fields stay null.
    input: { text: $nodes.redact.output.text }
    prompt: |
      Extract every purchased product from the receipt or order text in <input>.
      For each product give: name (product line without the brand), brand, model_number, upc (digits only), serial, category
      (one of Juvenile, Kitchen, Appliance, Vehicle, Tools, Food, Electronics, Toys, Home, Other), price (unit price as a number),
      quantity, warranty_months (only when the text states a warranty term), vin (17 characters, vehicles only), notes (lot codes,
      sizes, colors, anything a recall match could hinge on).
      Also give the retailer, the purchase_date (YYYY-MM-DD; use the order or transaction date), order_ref, an overall confidence 0..1,
      fields_confident and fields_total (count the fields you filled with confidence versus the fields you could fill), and unsure
      (fields you guessed). Never invent a value the text does not support; use null instead.
    output_schema:
      type: object
      required: [retailer, purchase_date, order_ref, items, confidence, fields_confident, fields_total, unsure]
      additionalProperties: false
      properties:
        retailer: { type: [string, "null"] }
        purchase_date: { type: [string, "null"] }
        order_ref: { type: [string, "null"] }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, brand, model_number, upc, serial, category, price, quantity, warranty_months, vin, notes]
            additionalProperties: false
            properties:
              name: { type: string, minLength: 2 }
              brand: { type: [string, "null"] }
              model_number: { type: [string, "null"] }
              upc: { type: [string, "null"] }
              serial: { type: [string, "null"] }
              category: { type: string, enum: [Juvenile, Kitchen, Appliance, Vehicle, Tools, Food, Electronics, Toys, Home, Other] }
              price: { type: [number, "null"] }
              quantity: { type: [integer, "null"] }
              warranty_months: { type: [integer, "null"] }
              vin: { type: [string, "null"] }
              notes: { type: [string, "null"] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        fields_confident: { type: integer, minimum: 0 }
        fields_total: { type: integer, minimum: 0 }
        unsure: { type: array, items: { type: string } }

  - id: save_item
    kind: code
    description: Create the inventory rows, decode a VIN through vPIC, resolve the warranty term (receipt or category default, flagged), log the intake.
    module: ../reducers/save_item.py
    input: { extraction: $nodes.extract.output, source: $input.source, raw_text: $nodes.redact.output.text }
